  <script>
    // Sistema de auto-update para evitar cache preso
    (function() {
      const APP_VERSION = '1.0.6'; // Incremente aqui a cada grande atualização
      const lastVersion = localStorage.getItem('app_version');
      
      if (lastVersion && lastVersion !== APP_VERSION) {
        console.log('Nova versão detectada (' + APP_VERSION + '). Limpando cache e atualizando...');
        localStorage.setItem('app_version', APP_VERSION);
        
        // Tenta limpar caches do Service Worker antes de recarregar
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          });
        }
        
        // Força recarregamento ignorando cache do navegador
        window.location.reload(true);
      } else {
        localStorage.setItem('app_version', APP_VERSION);
      }
    })();
  </script>
