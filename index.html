<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport CORRETO (não quebra layout mobile) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Backstage Pro - Sistema para Artistas</title>

    <meta
      name="description"
      content="O Backstage Agenda é o aplicativo definitivo para quem quer ter o controle total da própria carreira. Mais que uma agenda, ele é o seu assistente pessoal nos bastidores, unindo organização, praticidade e gestão profissional em um só lugar."
    />

    <meta name="author" content="Backstage Pro" />

    <!-- PWA / APP MODE (manifest embutido - sem criar arquivo) -->
    <link
      rel="manifest"
      href='data:application/json,{
        "name":"Backstage Pro",
        "short_name":"Backstage",
        "start_url":"/",
        "display":"standalone",
        "background_color":"#0B0B0F",
        "theme_color":"#0B0B0F",
        "orientation":"portrait"
      }'
    />

    <!-- Cor do sistema (status bar mobile) -->
    <meta name="theme-color" content="#0B0B0F" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Backstage Pro - Sistema para Artistas" />
    <meta
      property="og:description"
      content="O Backstage Agenda é o aplicativo definitivo para quem quer ter o controle total da própria carreira."
    />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BackstagePro" />
    <meta name="twitter:title" content="Backstage Pro - Sistema para Artistas" />
    <meta
      name="twitter:description"
      content="O Backstage Agenda é o aplicativo definitivo para quem quer ter o controle total da própria carreira."
    />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="https://storage.googleapis.com/gpt-engineer-file-uploads/9qj3VeZL91gfDVoFV6uCl6z5ARu2/uploads/1765760875396-12.png"
    />
  </head>

  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
